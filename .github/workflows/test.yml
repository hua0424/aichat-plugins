name: test

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before testing: aichat-claw's packaging.test.ts asserts the built dist/ entry
      # (openclaw.plugin.json `entry` / package.json `main`) exists on disk. Without a prior
      # build those assertions fail in CI (packages were green locally only because dist/ was
      # already built). Building first also gives CI a tsc type-check.
      - run: pnpm build
      - run: pnpm test:run
